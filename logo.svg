    <circle cx="169.0" cy="216.2" r="2"/>
    <circle cx="153.4" cy="222.7" r="2"/>
    <circle cx="136.9" cy="226.7" r="2"/>
    <circle cx="120.0" cy="228.0" r="2"/>
    <circle cx="103.1" cy="226.7" r="2"/>
    <circle cx="86.6" cy="222.7" r="2"/>
    <circle cx="71.0" cy="216.2" r="2"/>
