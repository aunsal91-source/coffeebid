    <circle cx="17.3" cy="153.4" r="2"/>
    <circle cx="13.3" cy="136.9" r="2"/>
    <circle cx="12.0" cy="120.0" r="2"/>
    <circle cx="13.3" cy="103.1" r="2"/>
    <circle cx="17.3" cy="86.6" r="2"/>
    <circle cx="23.8" cy="71.0" r="2"/>
    <circle cx="32.6" cy="56.5" r="2"/>
    <circle cx="43.6" cy="43.6" r="2"/>
    <circle cx="56.5" cy="32.6" r="2"/>
    <circle cx="71.0" cy="23.8" r="2"/>
    <circle cx="86.6" cy="17.3" r="2"/>
    <circle cx="103.1" cy="13.3" r="2"/>
    <circle cx="120.0" cy="12.0" r="2"/>
    <circle cx="136.9" cy="13.3" r="2"/>
    <circle cx="153.4" cy="17.3" r="2"/>
    <circle cx="169.0" cy="23.8" r="2"/>
