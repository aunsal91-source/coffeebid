<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .wordmark { font-family: Georgia, "Times New Roman", serif; font-weight: 700; }
      .subtext { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- perforation / stamp ring -->
  <g fill="#B5472A" opacity="0.5">
    <circle cx="228.0" cy="120.0" r="2"/>
    <circle cx="226.7" cy="136.9" r="2"/>
    <circle cx="222.7" cy="153.4" r="2"/>
    <circle cx="216.2" cy="169.0" r="2"/>
    <circle cx="207.4" cy="183.5" r="2"/>
