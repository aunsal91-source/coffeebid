  <!-- base badge -->
  <circle cx="120" cy="120" r="100" fill="#F5EDD9" stroke="#B5472A" stroke-width="3"/>
  <circle cx="120" cy="120" r="90" fill="none" stroke="#1A1208" stroke-width="1" opacity="0.15"/>

  <!-- bottom awning-stripe accent -->
  <path d="M172,210.1 A104,104 0 0 1 68,210.1" fill="none" stroke="#6FA8D0" stroke-width="9" stroke-linecap="round"/>

  <!-- coffee cup icon -->
  <g>
    <!-- side steam curls -->
    <path d="M100,52 C96,44 104,40 100,32" fill="none" stroke="#1A1208" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M140,52 C144,44 136,40 140,32" fill="none" stroke="#1A1208" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>

    <!-- center steam styled as a rising bid arrow -->
    <path d="M120,52 Q117,42 120,32" fill="none" stroke="#6B8C6E" stroke-width="4" stroke-linecap="round"/>
    <path d="M112,40 L120,30 L128,40" fill="none" stroke="#6B8C6E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- saucer -->
    <ellipse cx="120" cy="111" rx="45" ry="7" fill="#1A1208"/>

    <!-- handle -->
    <path d="M150,70 C172,70 172,100 150,100" fill="none" stroke="#1A1208" stroke-width="7" stroke-linecap="round"/>

    <!-- cup body -->
    <path d="M88,62 L95,104 Q120,113 145,104 L152,62 Z" fill="#1A1208"/>

    <!-- coffee surface -->
    <ellipse cx="120" cy="62" rx="32" ry="8" fill="#B5472A"/>
  </g>

  <!-- wordmark -->
  <text x="120" y="161" text-anchor="middle" class="wordmark" font-size="23" letter-spacing="0.5" fill="#1A1208">COFFEEBID</text>
  <text x="120" y="182" text-anchor="middle" class="subtext" font-size="13" font-weight="700" letter-spacing="1" fill="#B5472A">MOST WANTED</text>
